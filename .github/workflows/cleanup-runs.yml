name: Cleanup old block_ads runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Delete old Block ads update runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Finding Block ads update workflow..."

          WORKFLOW_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows" \
            --paginate \
            --jq '.workflows[] | select(.name == "Block ads update") | .id' |
            head -n 1)

          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow 'Block ads update' not found."
            echo "Available workflows:"
            gh api \
              "/repos/${{ github.repository }}/actions/workflows" \
              --paginate \
              --jq '.workflows[] | "\(.id) - \(.name)"'
            exit 1
          fi

          echo "Workflow ID: $WORKFLOW_ID"
          echo "Keeping newest 5 runs."

          gh api \
            --paginate \
            "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .run_number, .created_at] | @tsv' |
          tail -n +6 |
          while IFS=$'\t' read -r RUN_ID RUN_NUMBER CREATED_AT; do

            echo "Deleting run #${RUN_NUMBER} (${CREATED_AT})..."

            gh api \
              --method DELETE \
              "/repos/${{ github.repository }}/actions/runs/${RUN_ID}"

          done

          echo "Cleanup complete."
