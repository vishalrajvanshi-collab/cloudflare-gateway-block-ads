name: Cleanup old block_ads runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          REPO="${{ github.repository }}"

          cleanup_workflow() {
            WORKFLOW_NAME="$1"

            echo ""
            echo "========================================"
            echo "Cleaning: ${WORKFLOW_NAME}"
            echo "========================================"

            WORKFLOW_ID=$(gh api \
              "/repos/${REPO}/actions/workflows" \
              --paginate \
              --jq --arg NAME "$WORKFLOW_NAME" \
              '.workflows[] | select(.name == $NAME) | .id' |
              head -n 1)

            if [ -z "$WORKFLOW_ID" ]; then
              echo "Workflow not found: ${WORKFLOW_NAME}"
              return 0
            fi

            echo "Workflow ID: ${WORKFLOW_ID}"
            echo "Keeping newest 1 run."

            gh api \
              --paginate \
              "/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .run_number, .created_at] | @tsv' |
            tail -n +2 |
            cut -f1 |
            xargs -P 10 -n 1 -I {} sh -c '
              echo "Deleting run {}..."
              gh api \
                --method DELETE \
                "/repos/'"${REPO}"'/actions/runs/{}" || true
            '

            echo "Finished cleaning ${WORKFLOW_NAME}."
          }

          cleanup_workflow "Block ads update"
          cleanup_workflow "Cleanup old block_ads runs"

          echo ""
          echo "========================================"
          echo "Cleanup complete."
          echo "========================================"
