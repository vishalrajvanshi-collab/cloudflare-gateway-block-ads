name: Cleanup old workflow runs

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Delete all workflow runs except newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"

          newest_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$newest_run" ]; then
            echo "No workflow runs found."
            exit 0
          fi

          echo "Keeping newest run: $newest_run"

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json databaseId \
            --jq '.[].databaseId' |
          while read -r run_id; do
            if [ "$run_id" != "$newest_run" ]; then
              echo "Deleting run: $run_id"
              gh run delete "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --confirm || true
            fi
          done

          echo "Cleanup finished."
